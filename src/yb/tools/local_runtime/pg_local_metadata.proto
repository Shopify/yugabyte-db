syntax = "proto2";

package yb.local_runtime;

import "yb/common/common.proto";
import "yb/common/transaction.proto";
import "yb/tablet/metadata.proto";

// Persisted with the cloned catalog rows and SQL database/version tuples in one WAL batch.
message DatabasePB {
  required uint32 oid = 1;
  required string name = 2;
  repeated tablet.TableInfoPB catalogs = 3;
  required uint32 template_oid = 4;
}

// Separate native-intent component format, not the SQL runtime database catalog.
message LocalTransactionPB {
  required TransactionMetadataPB metadata = 1;
  required fixed64 read_ht = 2;
  required TransactionStatus status = 3;
  optional fixed64 commit_ht = 4;
  optional SubTransactionMetadataPB subtransaction = 5;
  optional uint32 next_write_id = 6 [default = 0];
  optional uint64 intent_bytes = 7 [default = 0];
  optional uint32 failed_subtransaction = 8 [default = 0];
  optional uint32 rollbacks = 9 [default = 0];
}
