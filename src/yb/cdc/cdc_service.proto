message TypeInfo {
  optional string modifier = 1;
  optional bool value_optional = 2;
}

message RowMessage {
  enum Op {
    UNKNOWN  = -1;
    INSERT   = 0;
    UPDATE   = 1;
    DELETE   = 2;
    BEGIN    = 3;
    COMMIT   = 4;
    DDL      = 5;
    TRUNCATE = 6;
    READ     = 7;
    SAFEPOINT= 8;
  }

  optional bytes  transaction_id = 1;
  optional uint64 commit_time = 2;
  optional string table = 3;
  optional Op op = 4;
  repeated DatumMessagePB new_tuple = 5;
  repeated DatumMessagePB old_tuple = 6;
  repeated TypeInfo new_typeinfo = 7;

  // Schema information used in case of DDL
  optional CDCSDKSchemaPB schema = 8;

  // Schema version
  optional uint32 schema_version = 9;

  // New table name, used in the case of rename table
  optional string new_table_name = 10;

  optional string pgschema_name = 11;

  // truncate info
  optional yb.tserver.TruncateRequestPB truncate_request_info = 13;
  optional uint64 record_time = 14;
  optional uint64 pg_lsn = 15;
  optional uint32 pg_transaction_id = 16;

  // The ID of the table associated with the row. Only populated for DMLs & DDLs
  // but not for other ops such as BEGIN/COMMIT/SAFEPOINT.
  optional string table_id = 17;

  // DocKey for the row in a table. Only populated for DMLs in the streaming phase but not
  // for other ops such as DDL/BEGIN/COMMIT/SAFEPOINT. Not populated in the Snapshot phase.
  optional bytes primary_key = 18;

  // Replication origin id associated with the transaction. Only set for COMMIT Ops.
  optional uint32 xrepl_origin_id = 19;
}

message CDCSDKProtoRecordPB {
  optional RowMessage row_message = 1;

  // Op id information to identify duplicate entries
  optional CDCSDKOpIdPB cdc_sdk_op_id = 2;

  optional CDCSDKOpIdPB from_op_id = 3;

  // Populated only on APPLYING records (those where row_message.op == COMMIT and
  // row_message.transaction_id is set). Mirrors tablet.TransactionStatePB.aborted
  // from the source WAL entry. Lists subtxn IDs that were rolled back via
  // ROLLBACK TO SAVEPOINT inside the committing transaction. Empty/unset means
  // no subtxns were aborted.
  //
  // This field describes what is in the WAL. It makes no assumption about how
  // the client uses it.
  optional SubtxnSetPB aborted_subtxn_set = 4;

  // Populated only on the terminal SPLIT_OP record emitted by StreamWAL on a
  // tablet that has been split. Carries the SplitTabletRequestPB payload
  // (new_tablet1_id / new_tablet2_id, split_partition_key, split_encoded_key)
  // so the client can resolve and resume on the child tablets.
  //
  // NOTE: This field is an addition to the StreamWAL data contract beyond the
  // single field originally enumerated in the spec's "Proto changes summary".
  // It is required because the spec also mandates that SPLIT_OP be emitted as
  // a CDCSDKProtoRecordPB carrying the SplitTabletRequestPB payload, and the
  // remaining fields on this message have no place to encode it.
  optional tablet.SplitTabletRequestPB split_tablet_request = 5;
}

// Resume cursor for StreamWAL. Identifies a unique resumption point on the
// leader: a WAL OpId, optionally augmented with a mid-APPLYING continuation
// position when a single transaction's intents could not fit in one batch.
//
// Three meaningful values in a request:
//   {term: 0,  index: 0}  -> "from start of retained WAL"; server emits
//                           synthetic bootstrap DDLs before any real records.
//                           intent_key / intent_write_id MUST be unset.
//   {term: -1, index: -1} -> SKIP-TO-TIP sentinel. Server emits synthetic
//                           bootstrap DDLs only; sets next_op_id to the
//                           current leader tip. No historical records.
//                           intent_key / intent_write_id MUST be unset.
//   {term: T,  index: I}  -> "records strictly after OpId(T, I)"; no bootstrap.
//                           Caller must already have schema cache for any
//                           schema_version active between (0,0) and (T,I).
//
// In a response, next_op_id is always a real (T, I) value (never a sentinel).
//
// PARTIAL-APPLYING RESUMPTION:
//
//   When a single UPDATE_TRANSACTION_OP { APPLYING } at OpId(T, I) produces
//   more intent records than fit in one batch, the server returns:
//
//     next_op_id = {term: T, index: I,
//                   intent_key: <docdb reverse-index key of the LAST intent
//                                already emitted; the next scan resumes one
//                                position past this key>,
//                   intent_write_id: <IntraTxnWriteId of that intent>}
//
//   The (term, index) are the APPLYING op's own OpId -- the cursor has NOT
//   advanced past the APPLYING. On the next call the server re-reads the
//   APPLYING WAL entry (cheap: single op fetch), resumes the IntentsDB scan
//   one position past (intent_key, intent_write_id), and continues emitting
//   intent records. When intent_key / intent_write_id are unset (the empty /
//   zero values), the APPLYING is fully drained and the cursor effectively
//   means "strictly after (T, I)".
//
//   Clients pass `next_op_id` back as `from_op_id` verbatim; they do not
//   inspect intent_key / intent_write_id. The fields are encoded on the
//   cursor only so the server can be stateless across calls.
message StreamWalCursorPB {
  optional int64 term = 1;
  optional int64 index = 2;

  // Mid-APPLYING resume fields. Both MUST be unset together (the common
  // case) or both MUST be set together (resuming a spilled APPLYING).
  // Servers reject mixed states with INVALID_REQUEST.
  //
  // intent_key is the bytes form of docdb::ApplyTransactionState::key (the
  // reverse-index key into IntentsDB). intent_write_id is the
  // IntraTxnWriteId associated with that key. Together they identify the
  // LAST intent already emitted in the prior batch; the server resumes the
  // scan one position past this point.
  optional bytes  intent_key      = 3;
  optional uint32 intent_write_id = 4;
}

message StreamWalRequestPB {
  // REQUIRED. The tablet to stream from.
  optional bytes tablet_id = 1;

  // REQUIRED. See StreamWalCursorPB for the three valid forms.
  optional StreamWalCursorPB from_op_id = 2;

  // Soft cap on records returned in this batch. Default 1000. Server may
  // return fewer. Server never splits a single WAL op across batches even
  // if it produces more than max_records RowMessages.
  optional uint32 max_records = 3 [default = 1000];

  // Soft cap on response bytes (decoded record payload). Default 4 MiB.
  // Server defers the next record to the next batch if including it would
  // exceed max_bytes. Records are never truncated.
  optional uint64 max_bytes = 4 [default = 4194304];

  // Server-side wait budget when no records are immediately available.
  // 0 -> short-poll: return immediately with an empty batch + unchanged
  //     cursor + has_more=false.
  // N -> long-poll: server blocks up to N ms before returning.
  // Capped server-side by cdcsdk_wal_reads_deadline_buffer_secs.
  // v1 default: 0.
  optional uint32 deadline_ms = 5 [default = 0];
}

message StreamWalResponsePB {
  // Error envelope. On error, only `error` and (for LEADER_NOT_READY)
  // `tablet_consensus_info` are populated. All other fields are unset.
  optional CDCErrorPB error = 1;

  // Decoded records in strict WAL order: monotonically increasing
  // (cdc_sdk_op_id.term, cdc_sdk_op_id.index, cdc_sdk_op_id.write_id).
  // Includes synthetic bootstrap DDLs at the front of the batch when
  // applicable; see the contract's "Synthetic DDL bootstrap" section.
  repeated CDCSDKProtoRecordPB records = 2;

  // REQUIRED on success (including empty success batches). Cursor to pass
  // as from_op_id on the next call.
  //   - If `records` is non-empty and contains any non-synthetic record,
  //     next_op_id == the (term, index) of the last non-synthetic record.
  //   - If `records` contains only synthetic bootstrap DDLs (skip-to-tip
  //     sentinel path), next_op_id == leader_tip_op_id at the time of the
  //     bootstrap.
  //   - If `records` is empty, next_op_id == the request's from_op_id
  //     (no progress).
  optional StreamWalCursorPB next_op_id = 3;

  // REQUIRED on success. Last replicated OpId on the leader at the moment
  // this response was generated. Use for:
  //   - Per-tablet lag computation (e.g. leader_tip.index - next_op_id.index).
  //   - "Caught up" detection (next_op_id == leader_tip_op_id).
  optional StreamWalCursorPB leader_tip_op_id = 4;

  // REQUIRED on success. Leader's safe HybridTime at response time. Use
  // for emitting downstream SAFEPOINT / heartbeat records and for clock
  // skew monitoring. Equivalent semantics to today's
  // GetChangesResponsePB.safe_hybrid_time.
  optional fixed64 leader_safe_hybrid_time = 5;

  // True iff more data is immediately available past next_op_id. When
  // false, the client should backoff before the next call. (When true,
  // the client can call again immediately without backoff.)
  optional bool has_more = 6;

  // Populated only when error.code == LEADER_NOT_READY. Lets the client
  // refresh its meta-cache without going to master.
  optional yb.tserver.TabletConsensusInfoPB tablet_consensus_info = 7;
}

message GetChangesResponsePB {
  optional CDCErrorPB error = 1;
  optional CDCRecordType record_type = 2 [default = CHANGE];
  optional CDCRecordFormat record_format = 3;
  repeated CDCRecordPB records = 4;

  // Checkpoint that consumers can send back in GetChanges RPC
  // to mark all CDC records in this GetChanges batch as committed.
  optional CDCCheckpointPB checkpoint = 5;

  // In case the tablet is no longer hosted on this tserver, provide the list of tservers holding
  // data for the tablet.
  repeated HostPortPB tserver = 6;

  // repeated CDCSDKRecordPB cdc_sdk_records = 7;
  repeated CDCSDKProtoRecordPB cdc_sdk_proto_records = 8;

  // In addition to the op id info, cdc_sdk_checkpoint also stores the info about write_id and
  // reverse_index_key so that it could be used  to resume partially streamed intents
  optional CDCSDKCheckpointPB cdc_sdk_checkpoint = 9;

  // The safe time to be used on the target for this tablet.
  optional int64 safe_hybrid_time = 10;

  // index used to filter out the records we've already streamed.
  optional int32 wal_segment_index = 11 [default = 0];

  // Only set in xCluster streams when error is AUTO_FLAGS_CONFIG_VERSION_MISMATCH.
  optional uint32 auto_flags_config_version = 12;

  optional yb.tserver.TabletConsensusInfoPB tablet_consensus_info = 13;
}

message GetCheckpointRequestPB {
  optional bytes stream_id = 1;
  optional bytes tablet_id = 2;
  // The table_id will be required in case of colocated tables.
  optional bytes table_id = 3;
  // Whether the caller knows the tablet address or needs to use us as a proxy.
  optional bool serve_as_proxy = 4 [default = true];
}

message GetCheckpointResponsePB {
  optional CDCErrorPB error = 1;
  optional CDCCheckpointPB checkpoint = 2;
  // The snapshot_key and snapshot_time will be used for CDCSDK snapshot purposes.
  optional bytes snapshot_key = 3;
  optional uint64 snapshot_time = 4;
}

message UpdateCdcReplicatedIndexRequestPB {
  // Old API. Deprecated.
  optional bytes tablet_id = 1;
  optional int64 replicated_index = 2;
  optional int64 replicated_term = 3;
  // Batch API.
  // Tablets being updated.
  repeated bytes tablet_ids = 4;
  // Minimum replicated index for each tablet across all the streams.
  repeated int64 replicated_indices = 5;
  repeated int64 replicated_terms = 6;
  // Minimum checkpoint term and index  for CDCSDK stream, to do intent cleanup for this tablet.
  repeated OpIdPB cdc_sdk_consumed_ops = 7;
  repeated uint64 cdc_sdk_ops_expiration_ms = 8;
  repeated bytes stream_ids = 9;
  optional fixed64 cdc_sdk_safe_time = 10;
  repeated fixed64 cdc_sdk_safe_times = 11;
  // Is this an initial retention barrier setting request
  optional bool initial_retention_barrier = 12;
}

message UpdateCdcReplicatedIndexResponsePB {
  optional CDCErrorPB error = 1;
}

message BootstrapProducerRequestPB {
  repeated string table_ids = 1;
  // If the stream_ids are not provided, a new stream for each table will be created.
  repeated bytes xrepl_stream_ids = 2;
  // Check if data bootstrap is required. Equivalent to the IsBootstrapRequired RPC.
  optional bool check_if_bootstrap_required = 3; // [default = false]
}

message BootstrapProducerResponsePB {
  optional CDCErrorPB error = 1;
  // New streams that were created. Only happens if the request does not have xrepl_stream_ids.
  repeated bytes cdc_bootstrap_ids = 2;
  // Minimum time after which data is available on all the bootstrapped streams.
  optional fixed64 bootstrap_time = 3;
  // Only set if check_if_bootstrap_required is set on the request.
  optional bool bootstrap_required = 4; // [default = false]
}

message GetLatestEntryOpIdRequestPB {
  optional bytes tablet_id = 1; // Deprecated.
  repeated bytes tablet_ids = 2; // Batch param.
}

message GetLatestEntryOpIdResponsePB {
  optional CDCErrorPB error = 1;

  optional OpIdPB op_id = 2; // Deprecated.
  repeated OpIdPB op_ids = 3; // Batch param.
  optional fixed64 bootstrap_time = 4;
}

message TableInfo {
  optional bytes stream_id = 1;
  optional bytes table_id = 2;
}

message GetCDCDBStreamInfoRequestPB {
  optional bytes db_stream_id = 1;
}

message GetCDCDBStreamInfoResponsePB {
  optional CDCErrorPB error = 1;
  optional bytes namespace_id = 2;
  repeated TableInfo table_info = 3;
  repeated TableInfo unqualified_table_info = 4;
}

message SetCDCCheckpointRequestPB {
  optional CDCCheckpointPB checkpoint = 1;
  optional CDCSDKCheckpointPB cdc_sdk_checkpoint = 2;
  optional bytes stream_id = 3;
  optional bytes tablet_id = 4;
  optional bool initial_checkpoint = 5 [default = false];
  optional bool bootstrap = 6 [default = false];
  optional fixed64 cdc_sdk_safe_time = 7;
  // Whether the caller knows the tablet address or needs to use us as a proxy.
  optional bool serve_as_proxy = 8 [default = true];
}

message SetCDCCheckpointResponsePB {
  optional CDCErrorPB error = 1;
}

message TabletCheckpointPair {
  optional yb.master.TabletLocationsPB tablet_locations = 1;
  optional CDCSDKCheckpointPB cdc_sdk_checkpoint = 2;
}

message GetTabletListToPollForCDCRequestPB {
  optional TableInfo table_info = 1;
  optional bytes tablet_id = 2;
}

message GetTabletListToPollForCDCResponsePB {
  optional CDCErrorPB error = 1;
  repeated TabletCheckpointPair tablet_checkpoint_pairs = 2;
}

message IsBootstrapRequiredRequestPB {
  repeated string tablet_ids = 1;
  optional string stream_id = 2;
}

message IsBootstrapRequiredResponsePB {
  optional CDCErrorPB error = 1;
  optional bool bootstrap_required = 2 [default = false];
}

// Metadata regarding replication status of a stream set up on a tablet.
message StreamTabletDrainInfoPB {
  required bytes stream_id = 1;
  required bytes tablet_id = 2;
}

message CheckReplicationDrainRequestPB {
  repeated StreamTabletDrainInfoPB stream_info = 1;
  optional uint64 target_time = 2;
}

message CheckReplicationDrainResponsePB {
  optional CDCErrorPB error = 1;
  repeated StreamTabletDrainInfoPB drained_stream_info = 2;
}
