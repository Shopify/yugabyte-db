name: Shopify contribution tools

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/scripts/shopify/**'
      - '.claude/skills/shopify-create-issue/**'
      - '.github/tests/**'
      - '.github/workflows/pr-title.yml'
      - '.github/workflows/shopify-contributions.yml'
      - AGENTS.md
      - tox.ini

permissions:
  contents: read

jobs:
  shopify-contributions:
    name: Contribution tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .agents/scripts/shopify
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test contribution tools
        run: python -B -m unittest discover -s .agents/scripts/shopify -p 'test_*.py' -v
      - name: Check Python style
        run: |
          python -m pip install pycodestyle==2.14.0
          python -m pycodestyle .agents/scripts/shopify/*.py

  pr-title-cases:
    name: PR title cases
    # Linux only: the policy's regexes use \S, which the bash on macOS does not support.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .agents/scripts/shopify
            .github
      - name: Run the PR title policy against its fixture cases
        run: python3 -B .agents/scripts/shopify/pr_title_cases.py
