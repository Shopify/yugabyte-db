name: Shopify contribution tools

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/scripts/shopify/**'
      - '.claude/skills/shopify-create-issue/**'
      - '.github/workflows/shopify-contributions.yml'
      - AGENTS.md
      - tox.ini

permissions:
  contents: read

jobs:
  shopify-contributions:
    name: Contribution tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .agents/scripts/shopify
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test contribution tools
        run: python -B -m unittest discover -s .agents/scripts/shopify -p 'test_*.py' -v
      - name: Check Python style
        run: |
          python -m pip install pycodestyle==2.14.0
          python -m pycodestyle .agents/scripts/shopify/*.py
