name: "yb-gh"

# The title/description checks are only really needed on open/edit events,
# But then it won't be available from head commit if the PR is synchronized.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited ]
    paths-ignore:
      - README.md
      - 'docs/**'
      - '.github/vale-styles/**'

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Branch tag grammar: optional upstream-style v, two or more numeric parts, optional -shopify,
          # and a numbered release -shopify-N or candidate -shopify-N-candidate (N without leading zeros).
          # VERSION_RE must stay identical in all steps of this workflow that define it.
          VERSION_RE='v?[0-9]+(\.[0-9]+)+(-shopify(-[1-9][0-9]*(-candidate)?)?)?'
          ISSUES_RE='\[((#[0-9]+(,#[0-9]+)*)|([A-Z]+-[0-9]+(,[A-Z]+-[0-9]+)*))\]'
          # [shopify-only] marks a change that stays in this fork and is never submitted upstream.
          # It may replace the issue ID or follow it, on any base branch. Pair it with the
          # "upstream: skip" label; that pairing is a convention here, not something this check enforces.
          SHOPIFY_ONLY_RE='\[shopify-only\]'
          ISSUE_OR_TAG_RE="(${ISSUES_RE}(${SHOPIFY_ONLY_RE})?|${SHOPIFY_ONLY_RE})"
          # Titles on PG-version development branches (e.g. pg19) lead with [pgNN], and the issue
          # ID is optional there.
          TITLE_RE="^((\[(BACKPORT )?(${VERSION_RE})\])?${ISSUE_OR_TAG_RE}|\[(BACKPORT )?pg[0-9]+\](${ISSUE_OR_TAG_RE})?)"
          TITLE_RE+=' [a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*:'
          TITLE_RE+=' \S.{8,98}\S$'

          if [[ ! "$PR_TITLE" =~ $TITLE_RE ]]; then
            echo "::error ::Pull Request title must include issue ID, code area,"
            echo "::error ::  and a short description, with no extra whitespace."
            echo "::error ::Issue ID is optional after a [pgNN] branch tag."
            echo "::error ::Fork-only changes may use [shopify-only] in place of, or after, the issue ID."
            echo "::error ::Issue referenced must be a github issue or YB-internal Jira ID."
            echo "::error ::Short description must be less than 100 characters."
            echo "::error ::Backport branch should be used only for non-master release branches."
            echo "::error ::Examples:"
            echo "::error ::  [#12345,#12367] area: Cool feature xyz"
            echo "::error ::  [BACKPORT 2045.1][#12345] area1,area2: Must have fix"
            echo "::error ::  [pg19] area: PG19-only change"
            echo "::error ::  [shopify-only] Build: Fork-only CI change"
            exit 1
          fi
          echo "Pull Request title is valid."
      - name: Check Backport title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Branch tag grammar: optional upstream-style v, two or more numeric parts, optional -shopify,
          # and a numbered release -shopify-N or candidate -shopify-N-candidate (N without leading zeros).
          # VERSION_RE must stay identical in all steps of this workflow that define it.
          VERSION_RE='v?[0-9]+(\.[0-9]+)+(-shopify(-[1-9][0-9]*(-candidate)?)?)?'
          # BASH_REMATCH[2] is the whole (version|pgNN) group; inner VERSION_RE groups follow it.
          BACKPORT_RE="^\[(BACKPORT )?(${VERSION_RE}|pg[0-9]+)\]"
          RELEASE_BRANCH_RE="^(${VERSION_RE}|pg[0-9]+)\$"
          # Stacked PRs target feature branches; only release targets need a branch tag.
          if [[ ! "$BASE_REF" =~ $RELEASE_BRANCH_RE ]]; then
            if [[ "$PR_TITLE" =~ $BACKPORT_RE ]]; then
              echo "::error ::Integration and feature PRs must not specify a release target."
              exit 1
            fi
            echo "Pull Request title is valid for an integration or feature branch."
          else
            if [[ "$PR_TITLE" =~ $BACKPORT_RE ]]; then
              BACKPORT_BRANCH="${BASH_REMATCH[2]}"
              if [[ "${BACKPORT_BRANCH}" != "$BASE_REF" ]]; then
                echo "::error ::Backport branch in title (${BACKPORT_BRANCH}) does not match"
                echo "::error :: Pull Request base ref ($BASE_REF)."
                exit 1
              fi
              echo "Pull Request title branch reference ($BACKPORT_BRANCH) matches base reference."
            else
              echo "::error ::Pull Request title must begin with target release branch in brackets."
              echo "::error ::Examples:"
              echo "::error ::[BACKPORT 2045.1][#12345] area1,area2: Must have fix from master"
              echo "::error ::[2045.2][#12345] area: release-specific change"
              echo "::error ::[pg19] area: PG19-only change"
              exit 1
            fi
          fi
      - name: Check Backport references
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Branch tag grammar: optional upstream-style v, two or more numeric parts, optional -shopify,
          # and a numbered release -shopify-N or candidate -shopify-N-candidate (N without leading zeros).
          # VERSION_RE must stay identical in all steps of this workflow that define it.
          VERSION_RE='v?[0-9]+(\.[0-9]+)+(-shopify(-[1-9][0-9]*(-candidate)?)?)?'
          BACKPORT_RE="^\[BACKPORT (${VERSION_RE}|pg[0-9]+)\]"
          # Check for true backport, not just target branch in title.
          if [[ "$PR_TITLE" =~ $BACKPORT_RE ]]; then
            body="$PR_BODY"
            bp_error=0
            COMMIT_HDR_RE=($'\n'\|^)'Original commit(s)?:'
            COMMIT_LIST_RE='(- )?[0-9a-f]+ / [#D][0-9]+'
            if [[ "$body" =~ $COMMIT_HDR_RE ]]; then
              echo "Found original commit(s) tag."
            else
              bp_error=1
            fi
            if (( bp_error == 0 )) && [[ "$body" =~ $COMMIT_LIST_RE ]]; then
              echo "Found original commit info: ${BASH_REMATCH[0]}"
            else
              bp_error=1
            fi
            if (( bp_error == 1 )); then
              echo "::error ::Backport Pull Request must include original commit info."
              echo "::error ::Include SHA (full or prefix) and issue reference in the"
              echo "::error ::  Pull Request description."
              echo "::error ::Start at beginning of a line. Examples:"
              echo "::error ::Original commit: 123abc / #12345"
              echo "::error ::Original commits:"
              echo "::error ::- 123abc / #12345"
              echo "::error ::- 345def / #43555"
              exit 1
            fi
          else
            echo "Pull Request title does not indicate a backport."
          fi
